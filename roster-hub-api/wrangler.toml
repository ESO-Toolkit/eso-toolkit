name = "roster-hub-api"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
account_id = "75620f084ea25ade5ee57a71a830bba2"

[[d1_databases]]
binding = "DB"
database_name = "roster-hub-db"
database_id = "22ff9f6a-ddb4-43bc-a0ef-89881124cfa2"

# Workers AI binding — powers image moderation on upload
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put <NAME>`):
#   IMGBB_API_KEY            — ImgBB API key for image uploads
#   ESOLOGS_CLIENT_ID        — ESO Logs OAuth client ID (leaderboard sync)
#   ESOLOGS_CLIENT_SECRET    — ESO Logs OAuth client secret (leaderboard sync)

# Cleanup expired temp builds daily at 04:00 UTC
[triggers]
crons = ["0 4 * * *"]

[vars]
ALLOWED_ORIGINS = "https://esohelpers.com,https://www.esohelpers.com,https://eso-toolkit.github.io,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173"
