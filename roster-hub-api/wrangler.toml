name = "roster-hub-api"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "roster-hub-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173"
ESOLOGS_JWKS_URL = "https://www.esologs.com/.well-known/jwks.json"

[env.production]
vars = { ALLOWED_ORIGINS = "https://esohelpers.com,https://www.esohelpers.com" }
