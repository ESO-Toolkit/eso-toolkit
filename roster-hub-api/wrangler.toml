name = "roster-hub-api"
main = "src/index.ts"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
account_id = "75620f084ea25ade5ee57a71a830bba2"

[[d1_databases]]
binding = "DB"
database_name = "roster-hub-db"
database_id = "22ff9f6a-ddb4-43bc-a0ef-89881124cfa2"

[[r2_buckets]]
binding = "REPORT_BUILD_EVIDENCE"
bucket_name = "esotk-report-build-evidence"
preview_bucket_name = "esotk-report-build-evidence-dev"

# Workers AI binding — powers image moderation on upload
[ai]
binding = "AI"

# Secrets (set via `wrangler secret put <NAME>`):
#   IMGBB_API_KEY            — ImgBB API key for image uploads
#   ESOLOGS_CLIENT_ID        — ESO Logs OAuth client ID (leaderboard sync + GQL proxy)
#   ESOLOGS_CLIENT_SECRET    — ESO Logs OAuth client secret (leaderboard sync + GQL proxy)

# 04:00 UTC — temp-build cleanup + #1 roster sync + DPS parse ingest
# 10:00, 16:00, 22:00 UTC — DPS parse ingest only
# Four DPS passes a day cover the full ~35-boss rotation in ~1.5 days. The slice
# per run is small (6 encounters) because the ingest now pulls one ranking board
# PER CLASS — ~7 subrequests per boss against the free plan's 50-per-invocation
# cap. The handler branches on the fire time; see src/cron-schedule.ts.
[triggers]
# ONE trigger, four fire times. The account is on the Workers Free plan, capped
# at 5 cron triggers across ALL workers, and 4 are used by other projects — so a
# second entry here fails to register (code 10072) and that pass silently never
# runs. A list expression costs one slot and fires at every listed hour; the
# handler tells the passes apart by fire time (src/cron-schedule.ts). Adding
# hours to the list is free — it is the same single trigger.
crons = ["0 4,10,16,22 * * *"]

# Persistent logs. Every cron job runs inside its own try/catch that only
# `console.error`s, so without this a failing scheduled pass is INVISIBLE — which
# is exactly how `dps_parses` went unnoticed as missing from the database for two
# days while the cron fired on schedule and aborted on the first query.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
ALLOWED_ORIGINS = "https://esotk.com,https://www.esotk.com,https://eso-toolkit.github.io,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173"
DISCORD_BOT_URL = "https://eso-toolkit-discord-bot.eso-toolkit.workers.dev"
