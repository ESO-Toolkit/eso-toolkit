# Reports and Fights queries
# Used by: ReportFights.tsx, ReportFightDetails.tsx, UserReports.tsx

fragment Report on Report {
  code
  startTime
  endTime
  title
  visibility
  zone {
    name
  }
  owner {
    name
  }
  fights {
    ...Fight
  }

  phases {
    encounterID
    separatesWipes
    phases {
      id
      name
      isIntermission
    }
  }
}

fragment UserReportSummary on Report {
  code
  startTime
  endTime
  title
  visibility
  segments
  zone {
    id
    name
  }
  owner {
    name
  }
}

query getReportByCode($code: String!) {
  reportData {
    report(code: $code) {
      ...Report
    }
  }
}

query getCurrentUser {
  userData {
    currentUser {
      id
      name
      naDisplayName
      euDisplayName
    }
  }
}

query getUserReports($limit: Int, $page: Int, $userID: Int) {
  reportData {
    reports(limit: $limit, page: $page, userID: $userID) {
      data {
        ...UserReportSummary
      }
      total
      current_page
      per_page
      last_page
      has_more_pages
    }
  }
}

query getLatestReports($limit: Int, $page: Int, $startTime: Float, $endTime: Float, $zoneID: Int) {
  reportData {
    reports(limit: $limit, page: $page, startTime: $startTime, endTime: $endTime, zoneID: $zoneID) {
      data {
        ...UserReportSummary
        # Authoritative "has combat data" signal. ESO Logs can report
        # segments > 0 for a log whose fights failed to parse, which then renders
        # "No fights available" when opened. Selecting the fight ids lets the list
        # hide those logs instead of surfacing dead links. translate: false skips
        # upstream name auto-translation we never read (only ids are selected).
        fights(translate: false) {
          id
        }
      }
      total
      from
      to
      current_page
      per_page
      last_page
      has_more_pages
    }
  }
}
