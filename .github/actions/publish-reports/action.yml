name: Publish reports with retry
description: Publish report artifacts to an external GitHub Pages branch without losing concurrent runs

inputs:
  token:
    description: GitHub token with write access to the external reports repository
    required: true
  external-repository:
    description: Owner and repository name for the reports site
    required: true
  publish-dir:
    description: Directory containing the report artifacts to publish
    required: true
  destination-dir:
    description: Destination directory within the reports branch; use . for the branch root
    required: false
    default: .
  target-branch:
    description: Branch that backs the reports site
    required: false
    default: gh-pages
  commit-message:
    description: Commit message for the reports publication
    required: true
  max-attempts:
    description: Maximum number of conflict-aware push attempts
    required: false
    default: '6'

runs:
  using: composite
  steps:
    - name: Publish artifacts
      shell: bash
      env:
        REPORTS_TOKEN: ${{ inputs.token }}
        EXTERNAL_REPOSITORY: ${{ inputs['external-repository'] }}
        PUBLISH_DIR: ${{ inputs['publish-dir'] }}
        DESTINATION_DIR: ${{ inputs['destination-dir'] }}
        TARGET_BRANCH: ${{ inputs['target-branch'] }}
        COMMIT_MESSAGE: ${{ inputs['commit-message'] }}
        MAX_ATTEMPTS: ${{ inputs['max-attempts'] }}
      run: |
        set -euo pipefail

        if [[ -z "$REPORTS_TOKEN" ]]; then
          echo "::error::A reports-repository token is required."
          exit 1
        fi

        if ! [[ "$MAX_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::max-attempts must be a positive integer."
          exit 1
        fi

        workspace_dir="$(realpath "$GITHUB_WORKSPACE")"
        source_dir="$(realpath -m "$GITHUB_WORKSPACE/${PUBLISH_DIR#./}")"
        if [[ "$source_dir" != "$workspace_dir" && "$source_dir" != "$workspace_dir"/* ]]; then
          echo "::error::Publish directory must stay within the workflow workspace."
          exit 1
        fi
        if [[ "$source_dir" == "$workspace_dir" ]]; then
          echo "::error::Publish directory must be a dedicated artifact directory, not the workspace root."
          exit 1
        fi
        source_relative="${source_dir#"$workspace_dir"/}"
        case "/$source_relative/" in
          */.git/*)
            echo "::error::Publish directory cannot target Git metadata."
            exit 1
            ;;
        esac
        if [[ ! -d "$source_dir" ]]; then
          echo "::error::Publish directory does not exist: $source_dir"
          exit 1
        fi
        if IFS= read -r -d '' git_metadata_path < <(find "$source_dir" -name .git -print0 -quit); then
          echo "::error::Publish directory cannot contain Git metadata: $git_metadata_path"
          exit 1
        fi

        clone_dir="$(mktemp -d)"
        trap 'rm -rf "$clone_dir"' EXIT

        if [[ "$DESTINATION_DIR" == /* ]]; then
          echo "::error::Destination directory must stay within the reports branch."
          exit 1
        fi
        destination_path="$(realpath -m "$clone_dir/$DESTINATION_DIR")"
        if [[ "$destination_path" != "$clone_dir" && "$destination_path" != "$clone_dir"/* ]]; then
          echo "::error::Destination directory must stay within the reports branch."
          exit 1
        fi
        destination_dir="${destination_path#"$clone_dir"/}"
        if [[ "$destination_path" == "$clone_dir" ]]; then
          destination_dir=""
        fi
        case "/$destination_dir/" in
          */.git/*)
            echo "::error::Destination directory cannot target Git metadata."
            exit 1
            ;;
        esac
        case "$destination_dir" in
          nightly-tests | screen-size-tests)
            echo "::error::Publishers cannot replace a retained report root: $destination_dir"
            exit 1
            ;;
        esac

        auth_header="$(printf 'x-access-token:%s' "$REPORTS_TOKEN" | base64 | tr -d '\n')"
        remote_url="https://github.com/${EXTERNAL_REPOSITORY}.git"

        git -c http.extraHeader="AUTHORIZATION: basic $auth_header" \
          clone \
          --filter=blob:none \
          --no-checkout \
          --depth 1 \
          --branch "$TARGET_BRANCH" \
          "$remote_url" "$clone_dir"

        if [[ "$(git -C "$clone_dir" config --get remote.origin.promisor || true)" != "true" ]]; then
          echo "::error::Reports repository does not support a blobless partial clone."
          exit 1
        fi

        git -C "$clone_dir" config user.name "github-actions[bot]"
        git -C "$clone_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Preserve the full tree in the index without downloading its 4.7 GB of blobs.
        # Owned paths are copied into the otherwise-empty sparse worktree and staged below.
        git -C "$clone_dir" read-tree HEAD
        git -C "$clone_dir" sparse-checkout init --no-cone
        printf '/.report-publisher-empty-worktree/\n' |
          git -C "$clone_dir" sparse-checkout set --no-cone --stdin

        root_entries=()
        root_pathspecs=()
        if [[ -z "$destination_dir" ]]; then
          while IFS= read -r -d '' artifact_path; do
            entry="${artifact_path##*/}"
            case "$entry" in
              .git | nightly-tests | screen-size-tests)
                echo "::error::Root publisher cannot modify protected entry: $entry"
                exit 1
                ;;
            esac
            root_entries+=("$entry")
            root_pathspecs+=(":(literal)$entry")
          done < <(find "$source_dir" -mindepth 1 -maxdepth 1 -print0)

          if (( ${#root_entries[@]} == 0 )); then
            echo "No root report artifacts to publish."
            exit 0
          fi
        fi

        sync_artifacts() {
          if [[ -n "$destination_dir" ]]; then
            local target_dir="$clone_dir/$destination_dir"
            mkdir -p "$target_dir"
            rsync -a --delete "$source_dir/" "$target_dir/"
          else
            local entry
            for entry in "${root_entries[@]}"; do
              rm -rf -- "$clone_dir/$entry"
              if [[ -d "$source_dir/$entry" && ! -L "$source_dir/$entry" ]]; then
                mkdir -p -- "$clone_dir/$entry"
                rsync -a "$source_dir/$entry/" "$clone_dir/$entry/"
              else
                rsync -a "$source_dir/$entry" "$clone_dir/"
              fi
            done
          fi
        }

        stage_artifacts() {
          if [[ -n "$destination_dir" ]]; then
            local destination_pathspec=":(literal)$destination_dir"
            git -C "$clone_dir" ls-files -z -- "$destination_pathspec" |
              git -C "$clone_dir" update-index --force-remove -z --stdin
            git -C "$clone_dir" add --sparse -A -- "$destination_pathspec"
          else
            git -C "$clone_dir" ls-files -z -- "${root_pathspecs[@]}" |
              git -C "$clone_dir" update-index --force-remove -z --stdin
            git -C "$clone_dir" add --sparse -A -- "${root_pathspecs[@]}"
          fi
        }

        commit_artifacts() {
          stage_artifacts
          if git -C "$clone_dir" diff --cached --quiet; then
            return 1
          fi
          git -C "$clone_dir" commit -m "$COMMIT_MESSAGE"
        }

        sync_artifacts
        if ! commit_artifacts; then
          echo "Reports are already up to date."
          exit 0
        fi

        for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
          if git -C "$clone_dir" -c http.extraHeader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:$TARGET_BRANCH"; then
            echo "Published reports on attempt $attempt."
            exit 0
          fi

          if (( attempt == MAX_ATTEMPTS )); then
            echo "::error::Failed to publish reports after $MAX_ATTEMPTS attempts."
            exit 1
          fi

          echo "Reports branch advanced; refreshing owned paths before retry $((attempt + 1))."
          sleep $((attempt * 2))
          git -C "$clone_dir" -c http.extraHeader="AUTHORIZATION: basic $auth_header" \
            fetch --filter=blob:none --depth 1 origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git -C "$clone_dir" reset --mixed -q "origin/$TARGET_BRANCH"
          git -C "$clone_dir" sparse-checkout reapply
          sync_artifacts
          if ! commit_artifacts; then
            echo "A concurrent publisher already uploaded these reports."
            exit 0
          fi
        done
