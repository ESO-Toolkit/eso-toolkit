name: 'Build and Deploy'
description: 'Build React app and Storybook, then deploy to GitHub Pages'
inputs:
  enable_sourcemaps:
    description: 'Enable source map generation'
    required: false
    default: 'false'
  release_version:
    description: 'Release version to set in environment'
    required: false
    default: ''
  vite_ga_measurement_id:
    description: 'Google Analytics measurement identifier for the build'
    required: false
    default: ''
  vite_discord_client_id:
    description: 'Discord OAuth client ID for the build'
    required: true
  vite_roster_hub_api_url:
    description: 'Roster Hub API URL for the build'
    required: false
    default: 'https://roster-hub-api.eso-toolkit.workers.dev'
  vite_hires_map_base:
    description: 'Base URL for the AI-upscaled fight-replay map tiles (R2 bucket public URL)'
    required: false
    default: 'https://pub-87ec3d93bfd4456faec17c57e05093d9.r2.dev'
  rollbar_server_token:
    description: >-
      Rollbar post_server_item token. When set together with
      enable_sourcemaps, THIS build's own sourcemaps are uploaded before the
      deploy, so the maps always match the bundle that ships. Leave empty to
      skip the upload.
    required: false
    default: ''
  deployment_url:
    description: 'Origin the deployed assets are served from (used to derive Rollbar minified_url)'
    required: false
    default: 'https://esotk.com'
outputs:
  deployment-url:
    description: 'URL where the site was deployed'
    value: ${{ steps.deployment.outputs.page_url }}
runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup-node-with-cache

    - name: Set release version
      if: inputs.release_version != ''
      shell: bash
      run: |
        echo "REACT_APP_VERSION=${{ inputs.release_version }}" >> $GITHUB_ENV
        echo "VITE_RELEASE_VERSION=${{ inputs.release_version }}" >> $GITHUB_ENV

    - name: Setup Pages
      uses: actions/configure-pages@v5
      id: setup

    - name: Build project
      shell: bash
      run: |
        export GENERATE_SOURCEMAP=${{ inputs.enable_sourcemaps }}
        export NODE_ENV=production
        npm run build
      env:
        VITE_BASE_URL: '${{steps.setup.outputs.base_path}}'
        VITE_GA_MEASUREMENT_ID: ${{ inputs.vite_ga_measurement_id }}
        VITE_DISCORD_CLIENT_ID: ${{ inputs.vite_discord_client_id }}
        VITE_ROSTER_HUB_API_URL: ${{ inputs.vite_roster_hub_api_url }}
        VITE_HIRES_MAP_BASE: ${{ inputs.vite_hires_map_base }}

    # Upload the sourcemaps produced by the build ABOVE, not by a second build:
    # a rebuild elsewhere sees different VITE_* inputs and a freshly generated
    # whats-new payload, so its content hashes never match the deployed
    # filenames and Rollbar orphans every map (audit P2-M5).
    - name: Upload sourcemaps to Rollbar
      if: inputs.enable_sourcemaps == 'true' && inputs.rollbar_server_token != ''
      uses: ./.github/actions/rollbar-sourcemaps
      with:
        access_token: ${{ inputs.rollbar_server_token }}
        release_version: ${{ inputs.release_version }}
        deployment_url: ${{ inputs.deployment_url }}

    - name: Build Storybook
      shell: bash
      run: |
        export DISABLE_ESLINT_PLUGIN=true
        export STORYBOOK_BASE_PATH="${{steps.setup.outputs.base_path}}storybook/"
        npm run build-storybook

    - name: Move Storybook to build directory
      shell: bash
      run: |
        mkdir -p build/storybook
        cp -r storybook-static/* build/storybook/

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
