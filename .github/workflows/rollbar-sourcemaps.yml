name: Upload Sourcemaps to Rollbar

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  upload-sourcemaps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-with-cache

      - name: Set release version
        id: version
        run: |
          # Must be the FULL 40-char github.sha: the deployed bundle reports its
          # release as the full sha (deploy.yml -> build-and-deploy release_version:
          # github.sha -> REACT_APP_VERSION/VITE_RELEASE_VERSION). Rollbar only applies
          # a sourcemap when code_version matches the uploaded version exactly, so a
          # truncated prefix would orphan every map and leave prod traces minified.
          RELEASE_VERSION="${GITHUB_SHA}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
          echo "release=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${RELEASE_VERSION}"

      - name: Build project with sourcemaps
        run: |
          export REACT_APP_VERSION="${{ env.RELEASE_VERSION }}"
          export VITE_RELEASE_VERSION="${{ env.RELEASE_VERSION }}"
          export GENERATE_SOURCEMAP=true

          # esotk.com is a custom-domain GitHub Pages site, so the deploy build's
          # base (actions/configure-pages base_path) is '/', and assets are served
          # from https://esotk.com/assets/*. Build with base '/' here so the emitted
          # asset paths line up with the minified_url derived below — NOT '/<repo>/'.
          #
          # DEFERRED (P2-M5): this is still a SECOND build, separate from the deploy
          # build, and vite.config.mjs injects Date.now()/toISOString() via `define`
          # into every build — so content hashes here will not match the deployed
          # bundle's filenames. The only robust fix is to upload the deploy build's
          # own ./build/**/*.map (or drop the non-deterministic define injections).
          npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_BASE_URL: '/'
          NODE_ENV: production

      - name: Upload sourcemaps to Rollbar
        run: |
          DEPLOYMENT_URL="https://esotk.com"
          UPLOAD_COUNT=0
          FAIL_COUNT=0

          echo "Searching for sourcemap files in ./build/assets/ ..."
          if [ ! -d "./build/assets" ]; then
            echo "❌ Error: build/assets directory not found"
            exit 1
          fi

          while IFS= read -r -d '' mapfile; do
            # Derive the URL of the corresponding minified JS/CSS file
            filename=$(basename "${mapfile}" .map)
            minified_url="${DEPLOYMENT_URL}/assets/${filename}"

            echo "Uploading: ${mapfile} → ${minified_url}"

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api.rollbar.com/api/1/sourcemap \
              -F "access_token=${{ secrets.ROLLBAR_SERVER_TOKEN }}" \
              -F "version=${{ env.RELEASE_VERSION }}" \
              -F "minified_url=${minified_url}" \
              -F "source_map=@${mapfile}")

            if [ "${HTTP_STATUS}" = "200" ]; then
              UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              echo "  ✅ Uploaded (HTTP ${HTTP_STATUS})"
            else
              FAIL_COUNT=$((FAIL_COUNT + 1))
              echo "  ❌ Failed (HTTP ${HTTP_STATUS})"
            fi
          done < <(find ./build/assets -name "*.map" -type f -print0)

          echo ""
          echo "Upload complete: ${UPLOAD_COUNT} succeeded, ${FAIL_COUNT} failed"

          if [ "${FAIL_COUNT}" -gt 0 ]; then
            echo "⚠️ Some sourcemaps failed to upload. Check ROLLBAR_SERVER_TOKEN secret."
            exit 1
          fi

          if [ "${UPLOAD_COUNT}" -eq 0 ]; then
            echo "❌ No sourcemaps found to upload"
            exit 1
          fi

      - name: Notify success
        run: |
          echo "✅ Sourcemaps successfully uploaded to Rollbar"
          echo "Release: ${{ env.RELEASE_VERSION }}"
          echo "Environment: production"
        if: success()

      - name: Handle upload failure
        run: |
          echo "❌ Failed to upload sourcemaps to Rollbar"
          echo "Check that ROLLBAR_SERVER_TOKEN is set in repository secrets"
          echo "Use the 'post_server_item' token from your Rollbar project settings"
          exit 1
        if: failure()
