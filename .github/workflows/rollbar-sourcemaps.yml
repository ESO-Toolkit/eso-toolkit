# MANUAL FALLBACK ONLY.
#
# The production path uploads sourcemaps from the deploy job's own build
# (.github/actions/build-and-deploy -> .github/actions/rollbar-sourcemaps), so
# the maps always belong to the bundle that actually shipped.
#
# This workflow rebuilds from a ref instead, which can only ever produce
# matching content hashes when every build input matches the deploy build:
# the VITE_* values below, and the generated What's New payload. Use it to
# backfill a release whose deploy-time upload failed, then verify in Rollbar
# that traces for that version de-minify.
name: Upload Sourcemaps to Rollbar (manual backfill)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Full 40-char commit SHA the deployed bundle reports (defaults to this ref)'
        required: false
        default: ''

jobs:
  upload-sourcemaps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate protected release ref
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::release_version must be a full 40-character hexadecimal commit SHA."
              exit 1
            fi
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual sourcemap backfills without an explicit SHA must run from protected main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Build the RELEASE being backfilled, not whatever ref this workflow
          # was dispatched from. release_version only names the version string;
          # without this the job would bake that sha into a different commit's
          # assets and upload maps that match nothing that was ever deployed.
          ref: ${{ inputs.release_version != '' && inputs.release_version || github.sha }}

      - uses: ./.github/actions/setup-node-with-cache

      - name: Set release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          # Must be the FULL 40-char sha: the deployed bundle reports its release
          # as the full sha (deploy.yml -> build-and-deploy release_version:
          # github.sha -> REACT_APP_VERSION/VITE_RELEASE_VERSION). Rollbar only
          # applies a sourcemap when code_version matches the uploaded version
          # exactly, so a truncated prefix would orphan every map.
          RELEASE_VERSION="$RELEASE_VERSION_INPUT"
          if [ -z "${RELEASE_VERSION}" ]; then
            RELEASE_VERSION="${GITHUB_SHA}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "❌ release_version must be a full 40-char commit SHA (got '${RELEASE_VERSION}')"
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
          echo "Release version: ${RELEASE_VERSION}"

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Generate What's New data
        run: node scripts/generate-whats-new.cjs --count 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

      - name: Build project with sourcemaps
        run: |
          export REACT_APP_VERSION="${{ env.RELEASE_VERSION }}"
          export VITE_RELEASE_VERSION="${{ env.RELEASE_VERSION }}"
          export GENERATE_SOURCEMAP=true
          npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # esotk.com is a custom-domain Pages site, so the deploy build's base
          # (actions/configure-pages base_path) is '/', and assets are served from
          # https://esotk.com/assets/*. Mirror every VITE_* input the deploy build
          # uses — any difference changes the bundle content and its hash.
          VITE_BASE_URL: '/'
          NODE_ENV: production
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}

      - name: Upload sourcemaps to Rollbar
        uses: ./.github/actions/rollbar-sourcemaps
        with:
          access_token: ${{ secrets.ROLLBAR_SERVER_TOKEN }}
          release_version: ${{ env.RELEASE_VERSION }}

      - name: Notify success
        if: success()
        run: |
          echo "✅ Sourcemaps successfully uploaded to Rollbar"
          echo "Release: ${{ env.RELEASE_VERSION }}"
          echo "Environment: production"

      - name: Handle upload failure
        if: failure()
        run: |
          echo "❌ Failed to upload sourcemaps to Rollbar"
          echo "Check that ROLLBAR_SERVER_TOKEN is set in repository secrets"
          echo "Use the 'post_server_item' token from your Rollbar project settings"
          exit 1
