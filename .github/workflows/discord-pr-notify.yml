name: Discord PR Notifications

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    # Only run when a PR is actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Build and send Discord embed
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PR_UPDATES }}
        with:
          script: |
            const pr = context.payload.pull_request;

            // ── Fetch PR comments (issue comments + review comments) ──
            const [issueComments, reviewComments] = await Promise.all([
              github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              }),
              github.rest.pulls.listReviewComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }),
            ]);

            // ── Extract screenshots from PR body + all comments ──
            function extractImages(text) {
              if (!text) return [];
              const images = [];

              // Markdown images: ![alt](url)
              const mdRegex = /!\[.*?\]\((https?:\/\/[^\s)]+\.(?:png|jpg|jpeg|gif|webp|svg)(?:\?[^\s)]*)?)\)/gi;
              let match;
              while ((match = mdRegex.exec(text)) !== null) {
                images.push(match[1]);
              }

              // HTML images: <img src="url" ...>
              const htmlRegex = /<img[^>]+src=["'](https?:\/\/[^\s"']+\.(?:png|jpg|jpeg|gif|webp|svg)(?:\?[^\s"']*)?)["'][^>]*>/gi;
              while ((match = htmlRegex.exec(text)) !== null) {
                images.push(match[1]);
              }

              // GitHub user-uploaded assets (no extension in URL)
              const ghAssetRegex = /!\[.*?\]\((https:\/\/github\.com\/[^/]+\/[^/]+\/assets\/[^\s)]+)\)/gi;
              while ((match = ghAssetRegex.exec(text)) !== null) {
                if (!images.includes(match[1])) images.push(match[1]);
              }

              // GitHub user-attachments format
              const ghAttachRegex = /!\[.*?\]\((https:\/\/github\.com\/user-attachments\/assets\/[^\s)]+)\)/gi;
              while ((match = ghAttachRegex.exec(text)) !== null) {
                if (!images.includes(match[1])) images.push(match[1]);
              }

              return images;
            }

            const allBodies = [
              pr.body,
              ...issueComments.data.map((c) => c.body),
              ...reviewComments.data.map((c) => c.body),
            ];

            const screenshots = [];
            const seen = new Set();
            for (const body of allBodies) {
              for (const url of extractImages(body)) {
                if (!seen.has(url)) {
                  seen.add(url);
                  screenshots.push(url);
                }
              }
            }

            // ── Convert GitHub markdown → Discord markdown ──
            function toDiscordMarkdown(text) {
              if (!text) return '*No description provided.*';

              let result = text;

              // Convert headers to bold (Discord embeds don't render # headers well)
              result = result.replace(/^#{1,3}\s+(.+)$/gm, '**$1**');

              // Remove HTML tags (Discord doesn't render them)
              result = result.replace(/<br\s*\/?>/gi, '\n');
              result = result.replace(/<\/?(?:details|summary|div|span|p|table|thead|tbody|tr|td|th|hr)[^>]*>/gi, '');
              result = result.replace(/<img[^>]*>/gi, ''); // images handled separately

              // Convert checkboxes to emoji equivalents
              result = result.replace(/- \[x\]/gi, '✅');
              result = result.replace(/- \[ \]/g, '⬜');

              // Clean up excessive blank lines
              result = result.replace(/\n{3,}/g, '\n\n');

              // Truncate to Discord's 4096 char embed description limit
              if (result.length > 3900) {
                result = result.substring(0, 3900) + '\n\n*… truncated — [view full PR](' + pr.html_url + ')*';
              }

              return result.trim();
            }

            // ── Build labels string ──
            const labels = pr.labels
              .map((l) => '`' + l.name + '`')
              .join(' ');

            // ── Fetch changed files count ──
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 1,
            });

            // ── Build Discord embeds ──
            const MERGED_GREEN = 5763719; // Discord color int for #57F287

            const mainEmbed = {
              title: `#${pr.number} — ${pr.title}`,
              url: pr.html_url,
              description: toDiscordMarkdown(pr.body),
              color: MERGED_GREEN,
              author: {
                name: pr.user.login,
                url: pr.user.html_url,
                icon_url: pr.user.avatar_url,
              },
              fields: [],
              footer: {
                text: `${pr.base.ref} ← ${pr.head.ref} · ${pr.changed_files} file${pr.changed_files === 1 ? '' : 's'} changed`,
              },
              timestamp: pr.merged_at,
            };

            if (labels) {
              mainEmbed.fields.push({
                name: 'Labels',
                value: labels,
                inline: true,
              });
            }

            mainEmbed.fields.push({
              name: 'Changes',
              value: `\`+${pr.additions}\` / \`-${pr.deletions}\``,
              inline: true,
            });

            if (pr.milestone) {
              mainEmbed.fields.push({
                name: 'Milestone',
                value: pr.milestone.title,
                inline: true,
              });
            }

            // ── Assemble embeds array (main + screenshot embeds) ──
            // Discord groups embeds with the same URL into a gallery
            const embeds = [mainEmbed];

            // First screenshot goes on the main embed
            if (screenshots.length > 0) {
              mainEmbed.image = { url: screenshots[0] };
            }

            // Additional screenshots as separate embeds (same URL for grouping)
            // Discord allows up to 10 embeds per message
            for (let i = 1; i < Math.min(screenshots.length, 9); i++) {
              embeds.push({
                url: pr.html_url,
                image: { url: screenshots[i] },
              });
            }

            // ── Send to Discord webhook ──
            const webhookUrl = process.env.DISCORD_WEBHOOK;
            if (!webhookUrl) {
              core.setFailed('DISCORD_WEBHOOK_PR_UPDATES secret is not set');
              return;
            }

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: 'ESO Toolkit',
                embeds,
              }),
            });

            if (!response.ok) {
              const text = await response.text();
              core.setFailed(`Discord webhook failed (${response.status}): ${text}`);
            } else {
              core.info(`✅ Discord notification sent for PR #${pr.number}`);
              core.info(`   Screenshots included: ${screenshots.length}`);
            }
