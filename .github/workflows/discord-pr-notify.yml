name: Discord PR Notifications

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    # Only run when a PR is actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Forward to Discord notify worker
        uses: actions/github-script@v8
        env:
          WORKER_URL: ${{ secrets.DISCORD_NOTIFY_WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.DISCORD_NOTIFY_WEBHOOK_SECRET }}
        with:
          script: |
            const workerUrl = process.env.WORKER_URL;
            if (!workerUrl) {
              core.setFailed('DISCORD_NOTIFY_WORKER_URL secret is not set');
              return;
            }

            // Build the payload matching GitHub webhook format
            const payload = JSON.stringify(context.payload);

            // Generate HMAC-SHA256 signature
            const crypto = require('crypto');
            const hmac = crypto.createHmac('sha256', process.env.WEBHOOK_SECRET || '');
            hmac.update(payload);
            const signature = `sha256=${hmac.digest('hex')}`;

            const response = await fetch(`${workerUrl}/webhook/github`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Hub-Signature-256': signature,
                'X-GitHub-Event': 'pull_request',
              },
              body: payload,
            });

            const result = await response.json();

            if (!response.ok) {
              core.setFailed(`Worker failed (${response.status}): ${JSON.stringify(result)}`);
              return;
            }

            const pr = context.payload.pull_request;
            core.info(`✅ Discord forum post created for PR #${pr.number}`);
            core.info(`   Thread ID: ${result.threadId}`);
            core.info(`   Commit type: ${result.commitType}`);
            core.info(`   AI summary: ${result.aiSummary}`);
            core.info(`   Screenshots: ${result.screenshots}`);
