name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy'
        required: true
        type: choice
        options:
          - roster-hub-api
          - discord-bot

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Worker deploys must be dispatched from protected main."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ inputs.worker }}/package-lock.json

      - name: Install locked worker dependencies
        working-directory: ${{ inputs.worker }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ inputs.worker }}
          wranglerVersion: '4.125.0'
