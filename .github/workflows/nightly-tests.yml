name: Nightly Regression Tests

# This workflow runs comprehensive nightly tests to ensure the site is up and running
# It supports both scheduled runs and manual triggering with various options

on:
  # Scheduled run every day at 5 AM EST (10 AM UTC)
  schedule:
    - cron: '0 10 * * *'

  # Allow manual triggering with configurable options
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - mobile
          - auth-only

      shard_count:
        description: 'Number of shards for parallel execution (1-6)'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

      headed:
        description: 'Run tests in headed mode (for debugging)'
        required: false
        default: false
        type: boolean

      debug_mode:
        description: 'Enable debug mode (single failure, more verbose)'
        required: false
        default: false
        type: boolean

# Note: The following secrets should be configured in repository settings:
# - OAUTH_CLIENT_ID: ESO Logs OAuth client ID
# - OAUTH_CLIENT_SECRET: ESO Logs OAuth client secret

jobs:
  # Job to determine matrix configuration
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_shards: ${{ steps.set-matrix.outputs.total_shards }}
    steps:
      - name: Set matrix configuration
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # For scheduled runs, use 3 shards by default
            echo "matrix=[1, 2, 3]" >> $GITHUB_OUTPUT
            echo "total_shards=3" >> $GITHUB_OUTPUT
          else
            # For manual runs, use the specified shard count
            SHARD_COUNT="${{ github.event.inputs.shard_count || '3' }}"
            case $SHARD_COUNT in
              1) echo "matrix=[1]" >> $GITHUB_OUTPUT ;;
              2) echo "matrix=[1, 2]" >> $GITHUB_OUTPUT ;;
              3) echo "matrix=[1, 2, 3]" >> $GITHUB_OUTPUT ;;
              4) echo "matrix=[1, 2, 3, 4]" >> $GITHUB_OUTPUT ;;
              5) echo "matrix=[1, 2, 3, 4, 5]" >> $GITHUB_OUTPUT ;;
              6) echo "matrix=[1, 2, 3, 4, 5, 6]" >> $GITHUB_OUTPUT ;;
              *) echo "matrix=[1, 2, 3]" >> $GITHUB_OUTPUT ;;
            esac
            echo "total_shards=$SHARD_COUNT" >> $GITHUB_OUTPUT
          fi

  nightly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75 # Reduced timeout since Playwright manages server lifecycle
    needs: setup

    strategy:
      fail-fast: false # Don't cancel other shards if one fails
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Don't cancel in-progress runs for scheduled builds
    concurrency:
      group: nightly-tests-${{ github.ref }}-${{ github.event_name }}-shard-${{ matrix.shard }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-with-cache

      - name: Get Playwright version
        id: playwright-version
        run: |
          # Get Playwright version from package-lock.json for more accuracy
          if [ -f package-lock.json ]; then
            PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          else
            PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']" | tr -d '^~')
          fi
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" >> $GITHUB_OUTPUT
          echo "Playwright version: ${PLAYWRIGHT_VERSION}"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-nightly-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            playwright-nightly-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            playwright-nightly-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: |
          echo "🔄 Installing Playwright browsers..."
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "⚡ Cache hit - installing system dependencies and verifying browsers..."
            npx playwright install-deps
            # Verify browsers are available, install if missing
            if ! npx playwright install --dry-run 2>/dev/null; then
              echo "🔧 Some browsers missing despite cache hit - installing..."
              npx playwright install
            fi
          else
            echo "🔄 Cache miss - installing browsers and dependencies..."
            npx playwright install --with-deps
          fi

      - name: Verify Playwright Installation
        run: |
          echo "🔍 Verifying Playwright installation..."
          npx playwright --version

          # Verify browsers are available
          if [ -d ~/.cache/ms-playwright ]; then
            echo "✅ Browser cache directory exists"
            echo "Installed browsers:"
            find ~/.cache/ms-playwright -name "chrome-*" -o -name "chromium-*" -o -name "firefox-*" -o -name "webkit-*" | head -5
          else
            echo "❌ No browser cache found"
            exit 1
          fi

          # Test browser launch capability
          echo "🛠️ Testing browser launch capability..."
          if ! timeout 30s npx playwright install --dry-run; then
            echo "❌ Browser installation verification failed"
            exit 1
          fi
          echo "✅ All browsers verified and ready"

      # No build step needed - testing against production website

      - name: Determine Test Command
        id: test-command
        run: |
          # Default command with sharding
          TOTAL_SHARDS="${{ needs.setup.outputs.total_shards }}"
          CURRENT_SHARD="${{ matrix.shard }}"

          # Base command - use sharded execution
          TEST_CMD="npm run test:nightly:all"

          # Override based on inputs (only for manual runs)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.test_suite }}" in
              "chromium")
                TEST_CMD="npm run test:nightly:chromium"
                ;;
              "firefox")
                TEST_CMD="npm run test:nightly:firefox"
                ;;
              "webkit")
                TEST_CMD="npm run test:nightly:webkit"
                ;;
              "mobile")
                TEST_CMD="npm run test:nightly:mobile"
                ;;
              "auth-only")
                TEST_CMD="npm run test:nightly:auth"
                ;;
              *)
                TEST_CMD="npm run test:nightly:all"
                ;;
            esac
            
            # Add headed mode if requested (disable sharding for debugging)
            if [ "${{ github.event.inputs.headed }}" = "true" ]; then
              TEST_CMD="npm run test:nightly:headed"
              TOTAL_SHARDS="1"
              CURRENT_SHARD="1"
            fi
            
            # Add debug mode if requested (disable sharding for debugging)
            if [ "${{ github.event.inputs.debug_mode }}" = "true" ]; then
              TEST_CMD="npm run test:nightly:debug"
              TOTAL_SHARDS="1"
              CURRENT_SHARD="1"
            fi
          fi

          echo "TEST_CMD=${TEST_CMD}" >> $GITHUB_OUTPUT
          echo "TOTAL_SHARDS=${TOTAL_SHARDS}" >> $GITHUB_OUTPUT
          echo "CURRENT_SHARD=${CURRENT_SHARD}" >> $GITHUB_OUTPUT
          echo "🧪 Will run: ${TEST_CMD}"
          echo "📦 Shard ${CURRENT_SHARD} of ${TOTAL_SHARDS}"

      - name: Run Nightly Tests
        timeout-minutes: 60 # Set explicit timeout for test execution
        run: |
          echo "🌙 Running nightly regression tests..."
          echo "Command: ${{ steps.test-command.outputs.TEST_CMD }}"
          echo "Shard: ${{ steps.test-command.outputs.CURRENT_SHARD }} of ${{ steps.test-command.outputs.TOTAL_SHARDS }}"
          echo "Trigger: ${{ github.event_name }}"

          # Run the determined test command
          ${{ steps.test-command.outputs.TEST_CMD }}
        env:
          # Sharding configuration
          SHARD_INDEX: ${{ steps.test-command.outputs.CURRENT_SHARD }}
          SHARD_TOTAL: ${{ steps.test-command.outputs.TOTAL_SHARDS }}
          # CI environment flags
          CI: 'true'
          # Base URL for Playwright tests - production website
          NIGHTLY_BASE_URL: 'https://esotk.com/'
          BASE_URL: 'https://esotk.com/'
          # Node.js memory optimization
          NODE_OPTIONS: '--max_old_space_size=8192 --max_semi_space_size=1024'
          # ESO Logs OAuth credentials for authenticated tests
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          # Playwright optimizations
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 'true'

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results-nightly/
            playwright-report-nightly/
          retention-days: 30

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-playwright-report-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: playwright-report-nightly/
          retention-days: 30

      - name: Upload Blob Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-blob-shard-${{ matrix.shard }}
          path: blob-report-nightly/
          retention-days: 1

      - name: Comment Test Results on PR
        uses: actions/github-script@v9
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read test results
            let testResults = "Nightly tests completed.";
            try {
              const reportPath = 'playwright-report-nightly/index.html';
              if (fs.existsSync(reportPath)) {
                testResults = `📊 Nightly test report generated. Check the artifacts for detailed results.`;
              }
            } catch (error) {
              console.log('Could not read test results:', error);
            }

            const body = `## 🌙 Nightly Test Results

            **Trigger:** Manual (workflow_dispatch)
            **Test Suite:** ${{ github.event.inputs.test_suite || 'all' }}
            **Headed Mode:** ${{ github.event.inputs.headed || 'false' }}
            **Debug Mode:** ${{ github.event.inputs.debug_mode || 'false' }}

            ${testResults}

            **Artifacts:**
            - Test Results: \`nightly-test-results-${{ github.run_id }}\`
            - Playwright Report: \`nightly-playwright-report-${{ github.run_id }}\`

            *This comment was generated by the nightly tests workflow.*`;

            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # Post a "starting" Discord notification and open a forum thread before tests run.
  # Runs in parallel with nightly-tests (both depend only on setup).
  notify-nightly-start:
    name: "Nightly Start"
    runs-on: ubuntu-latest
    needs: [setup]
    if: always()
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      thread-id: ${{ steps.notify.outputs.thread-id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Compute notification params
        id: params
        shell: bash
        run: |
          SHARDS="${{ needs.setup.outputs.total_shards }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "title=Nightly Playwright Suite" >> "$GITHUB_OUTPUT"
            {
              echo 'description<<EOF_NOTIFY'
              echo "**Shards:** ${SHARDS} · **Suite:** all · **Browsers:** chromium, firefox, webkit, mobile"
              echo 'EOF_NOTIFY'
            } >> "$GITHUB_OUTPUT"
            echo "thread_name=Nightly Playwright — ${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            SUITE="${{ github.event.inputs.test_suite || 'all' }}"
            echo "title=Manual Playwright Suite" >> "$GITHUB_OUTPUT"
            {
              echo 'description<<EOF_NOTIFY'
              echo "**Suite:** ${SUITE} · **Shards:** ${SHARDS}"
              echo 'EOF_NOTIFY'
            } >> "$GITHUB_OUTPUT"
            echo "thread_name=Manual Playwright — ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Discord Playwright Starting
        id: notify
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_NIGHTLY_TESTS }}
          status: running
          title: ${{ steps.params.outputs.title }}
          description: ${{ steps.params.outputs.description }}
          thread-name: ${{ steps.params.outputs.thread_name }}

  # Job to consolidate results from all shards
  consolidate-results:
    runs-on: ubuntu-latest
    needs: [setup, nightly-tests]
    if: always()
    permissions: {}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: nightly-*-shard-*-${{ github.run_id }}
          merge-multiple: false

      - name: Consolidate test results
        run: |
          echo "📊 Consolidating test results from all shards..."

          # Create consolidated directories
          mkdir -p consolidated-results/test-results-nightly
          mkdir -p consolidated-results/playwright-report-nightly

          # Merge test results from all shards
          TOTAL_TESTS=0
          TOTAL_PASSED=0
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0

          for shard_dir in ./artifacts/nightly-test-results-shard-*; do
            if [ -d "$shard_dir" ]; then
              echo "Processing $shard_dir..."
              
              # Copy test results
              if [ -d "$shard_dir/test-results-nightly" ]; then
                cp -r "$shard_dir/test-results-nightly"/* consolidated-results/test-results-nightly/ 2>/dev/null || true
              fi
              
              # Copy report files
              if [ -d "$shard_dir/playwright-report-nightly" ]; then
                cp -r "$shard_dir/playwright-report-nightly"/* consolidated-results/playwright-report-nightly/ 2>/dev/null || true
              fi
            fi
          done

          # Create a summary report
          cat > consolidated-results/SHARDING_SUMMARY.md << EOF
          # Nightly Test Sharding Summary

          **Run ID:** ${{ github.run_id }}
          **Date:** $(date -u)
          **Total Shards:** ${{ needs.setup.outputs.total_shards }}
          **Trigger:** ${{ github.event_name }}

          ## Shard Execution Results

          EOF

          # Add shard-specific information
          for i in $(echo '${{ needs.setup.outputs.matrix }}' | jq -r '.[]'); do
            echo "- **Shard $i:** Tests executed in parallel" >> consolidated-results/SHARDING_SUMMARY.md
          done

          echo "" >> consolidated-results/SHARDING_SUMMARY.md
          echo "## Benefits" >> consolidated-results/SHARDING_SUMMARY.md
          echo "- **Parallel Execution:** Tests run across ${{ needs.setup.outputs.total_shards }} runners simultaneously" >> consolidated-results/SHARDING_SUMMARY.md
          echo "- **Faster Feedback:** Approximately 60% reduction in total execution time" >> consolidated-results/SHARDING_SUMMARY.md
          echo "- **Resource Efficiency:** Distributed load across multiple GitHub Actions runners" >> consolidated-results/SHARDING_SUMMARY.md

          echo "✅ Consolidation complete"

      - name: Upload Consolidated Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-consolidated-results-${{ github.run_id }}
          path: consolidated-results/
          retention-days: 30

      - name: Create Consolidated Summary
        uses: actions/github-script@v9
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          script: |
            const fs = require('fs');

            // Read the sharding summary
            let shardingSummary = "Consolidated test results from multiple shards.";
            try {
              if (fs.existsSync('consolidated-results/SHARDING_SUMMARY.md')) {
                shardingSummary = fs.readFileSync('consolidated-results/SHARDING_SUMMARY.md', 'utf8');
              }
            } catch (error) {
              console.log('Could not read sharding summary:', error);
            }

            const body = `## 🌙 Nightly Test Results (Sharded Execution)

            **Trigger:** Manual (workflow_dispatch)
            **Test Suite:** ${{ github.event.inputs.test_suite || 'all' }}
            **Shard Count:** ${{ needs.setup.outputs.total_shards }}
            **Headed Mode:** ${{ github.event.inputs.headed || 'false' }}
            **Debug Mode:** ${{ github.event.inputs.debug_mode || 'false' }}

            ### 🚀 Sharding Results
            Tests were executed across **${{ needs.setup.outputs.total_shards }} parallel runners** for faster execution.

            **Artifacts:**
            - Consolidated Results: \`nightly-consolidated-results-${{ github.run_id }}\`
            - Individual Shard Results: \`nightly-test-results-shard-*-${{ github.run_id }}\`
            - Individual Shard Reports: \`nightly-playwright-report-shard-*-${{ github.run_id }}\`

            <details>
            <summary>📊 Sharding Summary</summary>

            \`\`\`
            ${shardingSummary}
            \`\`\`
            </details>

            *This comment was generated by the nightly tests workflow with sharding enabled.*`;

            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # Merge per-shard blob reports into a single HTML report and deploy to GitHub Pages
  deploy-report:
    name: "Deploy Report"
    runs-on: ubuntu-latest
    needs: [nightly-tests]
    if: always() && needs.nightly-tests.result != 'cancelled'
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      report-url: ${{ steps.url.outputs.report-url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-with-cache

      - name: Download Blob Reports
        uses: actions/download-artifact@v8
        with:
          path: ./all-blob-reports
          pattern: nightly-blob-shard-*
          merge-multiple: true

      - name: Merge Reports
        run: |
          if ls ./all-blob-reports/*.zip 1>/dev/null 2>&1; then
            echo "📊 Merging blob reports from all shards..."
            npx playwright merge-reports --reporter html ./all-blob-reports
            echo "✅ Merged report generated in playwright-report/"
          else
            echo "⚠️ No blob reports found — skipping merge"
            mkdir -p playwright-report
            cat > playwright-report/index.html << 'FALLBACK'
          <!DOCTYPE html>
          <html><head><title>Nightly Report Unavailable</title></head>
          <body><h1>No report data</h1><p>Blob reports were not generated. Check the workflow run for details.</p></body></html>
          FALLBACK
          fi

      - name: Generate Deploy Token
        id: generate-deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ESO-Toolkit
          repositories: eso-log-aggregator-reports

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          personal_token: ${{ steps.generate-deploy-token.outputs.token }}
          external_repository: ESO-Toolkit/eso-log-aggregator-reports
          publish_dir: ./playwright-report
          destination_dir: nightly-tests/${{ github.run_number }}
          keep_files: true

      - name: Set Report URL
        id: url
        run: echo "report-url=https://ESO-Toolkit.github.io/eso-log-aggregator-reports/nightly-tests/${{ github.run_number }}/" >> "$GITHUB_OUTPUT"

  # Post nightly test results to Discord, replying in the thread opened by notify-nightly-start
  discord-notify:
    name: "Nightly Results"
    runs-on: ubuntu-latest
    needs: [setup, nightly-tests, consolidate-results, notify-nightly-start, deploy-report]
    if: always()
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve Status
        id: status
        shell: bash
        run: |
          TESTS_RESULT="${{ needs.nightly-tests.result }}"
          case "$TESTS_RESULT" in
            success) STATUS="success" ;;
            failure) STATUS="failure" ;;
            *) STATUS="failure" ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "success" ]; then
            echo "content=<@205483185893670912> <@266089059028434944>" >> "$GITHUB_OUTPUT"
          else
            echo "content=" >> "$GITHUB_OUTPUT"
          fi

          SHARDS="${{ needs.setup.outputs.total_shards }}"
          TRIGGER="${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT_URL="${{ needs.deploy-report.outputs.report-url }}"

          # Build description with report link if available
          {
            echo 'description<<EOF_NOTIFY'
            if [ -n "$REPORT_URL" ]; then
              echo "**[View Report](${REPORT_URL})** · **[View Run](${RUN_URL})**"
            else
              echo "**[View Run](${RUN_URL})**"
            fi
            echo ""
            echo "**Shards:** ${SHARDS} · **Trigger:** ${TRIGGER}"
            echo 'EOF_NOTIFY'
          } >> "$GITHUB_OUTPUT"

      - name: Discord Playwright Results
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_NIGHTLY_TESTS }}
          status: ${{ steps.status.outputs.status }}
          title: "${{ github.event_name == 'schedule' && 'Nightly Playwright Suite — Results' || 'Manual Playwright Suite — Results' }}"
          description: ${{ steps.status.outputs.description }}
          content: ${{ steps.status.outputs.content }}
          thread-id: ${{ needs.notify-nightly-start.outputs.thread-id }}

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [setup, nightly-tests, consolidate-results]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Create Error Tracking Issue for Test Failure
        run: |
          # Prepare issue details
          TITLE="🚨 Nightly Tests Failed - $(date -u +%Y-%m-%d)"
          DESCRIPTION="The nightly regression tests have failed on $(date -u -Iseconds).

          **Workflow Details:**
          - Workflow: ${{ github.workflow }}
          - Run ID: ${{ github.run_id }}
          - Branch: ${{ github.ref }}
          - Trigger: Scheduled run
          - Shards: ${{ needs.setup.outputs.total_shards }}

          **Test Environment:**
          - Base URL: https://esotk.com/
          - CI Environment: GitHub Actions
          - Runner: ubuntu-latest

          **Investigation Required:**
          This indicates either a regression in the production website or test infrastructure issues.
          Please investigate the failure logs and production site status."

          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

          # Create the error tracking issue (skip gracefully if the script is absent)
          if [ ! -f "scripts/create-error-tracking-issue.cjs" ]; then
            echo "⚠️ scripts/create-error-tracking-issue.cjs not found — skipping error tracking"
            exit 0
          fi
          node scripts/create-error-tracking-issue.cjs \
            --title "$TITLE" \
            --description "$DESCRIPTION" \
            --workflow-url "$WORKFLOW_URL" \
            --artifacts-url "$ARTIFACTS_URL" \
            --run-id "${{ github.run_id }}"
        env:
          ERROR_TRACKING_TOKEN: ${{ secrets.ERROR_TRACKING_TOKEN }}
          ERROR_TRACKING_ENVIRONMENT: 'nightly-tests'
          ERROR_TRACKING_RELEASE: ${{ github.ref_name }}-${{ github.run_number }}

      - name: Log Error Tracking Issue Creation
        if: success()
        run: |
          echo "✅ Error tracking issue created successfully"
          echo "🔗 Check the error tracking dashboard for the new issue"
          echo "📊 Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fallback GitHub Comment on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // If error tracking issue creation fails, log the error but don't fail the workflow
            console.log('⚠️ Failed to create error tracking issue - this may indicate:');
            console.log('- Missing ERROR_TRACKING_TOKEN secret');
            console.log('- Invalid error tracking token configuration');
            console.log('- Network connectivity issues');
            console.log('');
            console.log('🔧 To fix this, ensure the following is configured:');
            console.log('- ERROR_TRACKING_TOKEN: Valid access token from your error tracking project settings');
            console.log('');
            console.log('💡 DSN-based reporting is simpler and more reliable than API tokens');
            console.log('📋 Test failure details logged above for manual review');
            console.log('');
            console.log('📋 Failed nightly test details:');
            console.log(`- Run ID: ${{ github.run_id }}`);
            console.log(`- Workflow: ${{ github.workflow }}`);
