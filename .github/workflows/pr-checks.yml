name: PR Checks

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  merge_group:
    branches:
      - main

jobs:
  check-do-not-merge-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Do Not Merge or Waiting on Parent labels
        # Skip label check in merge_group (labels already verified on PR) — job must still run
        # so the required status check reports back to GitHub instead of timing out.
        if: github.event_name != 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name.toLowerCase());
            const doNotMergeLabels = ['do not merge', 'do-not-merge', 'wip', 'work in progress', 'waiting on parent', 'waiting-on-parent'];

            const hasDoNotMergeLabel = doNotMergeLabels.some(label => 
              labels.some(prLabel => prLabel.includes(label.toLowerCase()))
            );

            if (hasDoNotMergeLabel) {
              const matchedLabels = labels.filter(prLabel => 
                doNotMergeLabels.some(blockLabel => prLabel.includes(blockLabel.toLowerCase()))
              );
              core.setFailed(`❌ This PR has blocking label(s): ${matchedLabels.join(', ')}. The PR cannot be merged until these labels are removed.`);
            } else {
              console.log('✅ No blocking labels found. PR can proceed.');
            }

  build:
    runs-on: ubuntu-latest
    # Only run on code changes, not label changes (always run for merge_group)
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-cache
      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    # Only run on code changes, not label changes (always run for merge_group)
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-cache
      - name: Lint
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  format:
    runs-on: ubuntu-latest
    # Only run on code changes, not label changes (always run for merge_group)
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-cache
      - name: Check formatting
        run: npm run format:check

  lint-skills:
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install skills-ref
        run: pip install skills-ref==0.1.1
      - name: Validate agent skills
        run: python scripts/lint-skills.py

  test:
    runs-on: ubuntu-latest
    # Only run on code changes, not label changes (always run for merge_group)
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-cache
      - name: Block external network access
        run: |
          # Block access to known external services during testing
          echo "127.0.0.1 esologs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 www.esologs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 rpglogs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 assets.rpglogs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 api.rollbar.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 fonts.googleapis.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 fonts.gstatic.com" | sudo tee -a /etc/hosts
          echo "Blocked external services in /etc/hosts:"
          cat /etc/hosts | grep "127.0.0.1"
      - name: Test
        run: npm run test:coverage:ci
        env:
          # Increase Node.js memory limit to prevent OOM errors
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Prevent external network requests during testing
          NO_PROXY: '*'
          HTTP_PROXY: 'http://127.0.0.1:9999'
          HTTPS_PROXY: 'http://127.0.0.1:9999'
          # Block known external services
          BLOCK_EXTERNAL_REQUESTS: 'true'
          # Override external service URLs to localhost (will fail if not mocked)
          ESOLOGS_API_URL: 'http://localhost:3000/mock-api'
          ERROR_TRACKING_TOKEN: ''

      - name: Roster Hub API Tests
        run: npm run test:roster-hub

      - name: Scribing E2E Tests
        run: npm run test:scribing
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          NO_PROXY: '*'
          HTTP_PROXY: 'http://127.0.0.1:9999'
          HTTPS_PROXY: 'http://127.0.0.1:9999'
          BLOCK_EXTERNAL_REQUESTS: 'true'
          ESOLOGS_API_URL: 'http://localhost:3000/mock-api'
          ERROR_TRACKING_TOKEN: ''

  typecheck:
    runs-on: ubuntu-latest
    # Only run on code changes, not label changes (always run for merge_group)
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-cache
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Install Roster Hub API dependencies
        run: npm ci --ignore-scripts
        working-directory: roster-hub-api
      - name: Typecheck Roster Hub API
        run: npm run typecheck
        working-directory: roster-hub-api
      - name: Audit Roster Hub API production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: roster-hub-api
      - name: Check no ESO-Hub references
        run: npm run check:no-esohub
      - name: Check tooltip provenance
        run: npm run check:provenance

  build-storybook:
    runs-on: ubuntu-latest
    # Only run on code changes, not label changes (always run for merge_group)
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-cache
      - name: Build Storybook
        run: npm run build-storybook
        env:
          DISABLE_ESLINT_PLUGIN: true

  playwright-smoke:
    runs-on: ubuntu-latest
    # Only run on code changes, not label changes (always run for merge_group)
    if: github.event_name == 'merge_group' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-cache

      - name: Install Playwright Browsers
        # Browser revisions can share directory names across Ubuntu releases while
        # requiring different system libraries. Install for this runner instead of
        # restoring binaries cached under the generic Linux OS key.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify Playwright Installation
        run: |
          npx playwright --version
          timeout 120s node <<'NODE'
          const { chromium, firefox, webkit } = require('@playwright/test');

          async function verifyBrowsers() {
            for (const browserType of [chromium, firefox, webkit]) {
              const browser = await browserType.launch({ timeout: 30_000 });
              await browser.close();
              console.log(`${browserType.name()} launched successfully`);
            }
          }

          verifyBrowsers().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Block external network access
        run: |
          # Block access to known external services during testing
          echo "127.0.0.1 esologs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 www.esologs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 rpglogs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 assets.rpglogs.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 api.rollbar.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 fonts.googleapis.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 fonts.gstatic.com" | sudo tee -a /etc/hosts
          echo "Blocked external services in /etc/hosts:"
          cat /etc/hosts | grep "127.0.0.1"
      - name: Generate version files for cache busting
        run: |
          echo "Generating version files for e2e tests..."
          node scripts/generate-version.cjs
          node scripts/update-manifest.cjs
      - name: Run Playwright smoke tests
        run: |
          echo "Running Playwright smoke tests..."
          echo "Node memory: $NODE_OPTIONS"
          echo "Playwright config: Smoke test mode with single worker"

          # System info for debugging
          echo "System information:"
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | head -2)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

          # Pre-warm the dependency cache
          echo "Pre-warming dependency cache..."
          npm run build --silent || echo "Build failed, continuing with tests..."

          # Optional health check (can be enabled if needed)
          # echo "Running health check..."
          # timeout 60 npm run health-check || echo "Health check failed or timed out, continuing..."

          # Run the smoke tests
          npm run test:smoke:e2e
        env:
          # Node.js memory optimization - increased for stability
          NODE_OPTIONS: '--max_old_space_size=8192 --max_semi_space_size=1024'
          # CI environment flags
          CI: 'true'
          # Prevent external network requests during testing
          NO_PROXY: '*'
          HTTP_PROXY: 'http://127.0.0.1:9999'
          HTTPS_PROXY: 'http://127.0.0.1:9999'
          # Block known external services
          BLOCK_EXTERNAL_REQUESTS: 'true'
          # Override external service URLs to localhost (will fail if not mocked)
          ESOLOGS_API_URL: 'http://localhost:3000/mock-api'
          ERROR_TRACKING_TOKEN: ''
          # Playwright memory optimization
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Run dedicated route, report-list, and edge-router tests
        run: |
          npm run test:analyzer-route
          npm run test:product-completion
          npm run test:report-controls-a11y
          npm run test:live-dashboard-health
          npm run test:report-lists
          npm run test:auth-enhanced
          npm run test:edge-router
          npm run test:deploy-contract
        env:
          NODE_OPTIONS: '--max_old_space_size=8192 --max_semi_space_size=1024'
          CI: 'true'
          NO_PROXY: '*'
          HTTP_PROXY: 'http://127.0.0.1:9999'
          HTTPS_PROXY: 'http://127.0.0.1:9999'
          BLOCK_EXTERNAL_REQUESTS: 'true'
          ESOLOGS_API_URL: 'http://localhost:3000/mock-api'
          ERROR_TRACKING_TOKEN: ''
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-smoke-report
          path: |
            playwright-report*/
            test-results*/
          retention-days: 30
