name: Manual Deploy to GitHub Pages

on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.build-and-deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual production deploys must be dispatched from protected main."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      
      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-with-cache
      
      - name: Generate What's New data
        run: node scripts/generate-whats-new.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Deploy
        id: build-and-deploy
        uses: ./.github/actions/build-and-deploy
        with:
          enable_sourcemaps: 'false'
          release_version: ${{ github.sha }}
          vite_ga_measurement_id: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          vite_discord_client_id: ${{ vars.VITE_DISCORD_CLIENT_ID }}
