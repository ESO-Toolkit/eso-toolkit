name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.build-and-deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-with-cache

      - name: Generate What's New data
        run: node scripts/generate-whats-new.cjs --count 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

      - name: Build and Deploy
        id: build-and-deploy
        uses: ./.github/actions/build-and-deploy
        with:
          enable_sourcemaps: 'true'
          release_version: ${{ github.sha }}
          vite_ga_measurement_id: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          vite_discord_client_id: ${{ vars.VITE_DISCORD_CLIENT_ID }}
          # Uploads this build's own maps under the same full github.sha the
          # bundle reports as its release version.
          rollbar_server_token: ${{ secrets.ROLLBAR_SERVER_TOKEN }}

      - name: Ping IndexNow with deployed URLs
        # Notify Bing (whose index also feeds DuckDuckGo, Ecosia, and several
        # AI search products) that the site's URLs have changed.
        #
        # urlList is read from build/sitemap.xml — the exact artifact the
        # build-and-deploy action just uploaded to Pages — rather than fetching
        # https://esotk.com/sitemap.xml, which can serve a stale cached copy
        # immediately after a deploy and would add a network dependency. The
        # sitemap is build-generated, so reading the build output cannot drift.
        #
        # Production-only (main push; the implicit success() in `if` also gates
        # this on a successful deploy) and best-effort: a search-engine ping
        # must never break a deploy, so every failure path is swallowed.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          # Public IndexNow verification key, served from /<key>.txt (public/).
          # IndexNow keys are public by design — this is not a secret.
          INDEXNOW_KEY: e95121a458dc464baa2a081d3220c741
        run: |
          set -euo pipefail
          HOST="esotk.com"
          SITEMAP="build/sitemap.xml"
          if [[ ! -f "$SITEMAP" ]]; then
            echo "::warning::$SITEMAP not found — skipping IndexNow ping."
            exit 0
          fi
          URL_LIST="$(sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' "$SITEMAP" | jq -R . | jq -cs .)"
          URL_COUNT="$(echo "$URL_LIST" | jq 'length')"
          if [[ "$URL_COUNT" == "0" ]]; then
            echo "::warning::No <loc> URLs found in $SITEMAP — skipping IndexNow ping."
            exit 0
          fi
          PAYLOAD="$(jq -n \
            --arg host "$HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://${HOST}/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"
          echo "Submitting ${URL_COUNT} URLs to IndexNow for host ${HOST}"
          STATUS="$(curl -sS -m 30 -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD" || true)"
          echo "IndexNow HTTP status: ${STATUS:-request-failed}"
          sed 's/^/IndexNow response: /' /tmp/indexnow-response.txt 2>/dev/null || true

  # Post deploy status to Discord. Runs after `deploy` regardless of outcome.
  discord-notify:
    name: "Deploy Notification"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the SHA of the previous successful deploy
          PREV_SHA=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=5" \
            --jq "[.workflow_runs[] | select(.head_sha != \"${{ github.sha }}\")][0].head_sha // empty" \
          ) || true

          if [ -n "$PREV_SHA" ] && git merge-base --is-ancestor "$PREV_SHA" HEAD 2>/dev/null; then
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              "${PREV_SHA}..HEAD")
          else
            # First deploy or ancestor not found — show last 10 commits
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              -10)
          fi

          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Discord Release Announcement
        if: needs.deploy.result == 'success'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          status: success
          title: "ESO Toolkit — New Release"
          environment: production
          commits: ${{ steps.changelog.outputs.commits }}
          thread-name: "Deploy #${{ github.run_number }}"

      - name: Discord Deploy Failure
        if: needs.deploy.result == 'failure'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          status: failure
          title: "Deploy to GitHub Pages"
          environment: production
          commits: ${{ steps.changelog.outputs.commits }}
